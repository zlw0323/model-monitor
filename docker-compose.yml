services:
  monitor:
    build: .
    image: model-monitor:latest
    container_name: model-monitor
    restart: unless-stopped
    env_file: .env
    environment:
      # Only Caddy (fixed IP below) may set X-Forwarded-For, so the login throttle sees real client IPs.
      - FORWARDED_ALLOW_IPS=172.30.53.10
    volumes:
      - monitor_data:/data
    networks:
      - monitor_net
    # Default: only reachable from the server itself (use the Caddy profile for public HTTPS access).
    # Set APP_BIND=0.0.0.0 in .env to expose plain HTTP on port 8000 directly.
    ports:
      - "${APP_BIND:-127.0.0.1}:8000:8000"

  caddy:
    image: caddy:2
    profiles: ["https"]
    container_name: model-monitor-caddy
    restart: unless-stopped
    depends_on: [monitor]
    environment:
      - DOMAIN=${DOMAIN:-}
      - PUBLIC_IP=${PUBLIC_IP:-}
    ports:
      # HTTPS_PORT: public port of the panel. HTTP_PUBLISH: port 80 is only needed for certificate issuance
      # with a domain; set it to 127.0.0.1:8080 to keep it closed (IP mode).
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PUBLISH:-80}:80"
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      monitor_net:
        ipv4_address: 172.30.53.10

networks:
  monitor_net:
    ipam:
      config:
        - subnet: 172.30.53.0/24

volumes:
  monitor_data:
  caddy_data:
  caddy_config:
